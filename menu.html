<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Best Kitchen | Our Menu</title>
    <link rel="stylesheet" href="./styling1.css" />
</head>

<body>

    <!-- Sticky Navigation -->
    <header class="main-header">
        <div class="nav-container">
            <a href="./index.html" class="logo">World Best Kitchen</a>

            <nav class="desktop-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about-Us.html">About</a></li>
                    <li><a href="menu.html" class="active">Menu</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="reservation.html">Reservations</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <span class="icon">🌓</span>
            </button>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </header>

    <!-- Menu Page Header -->
    <section class="menu-hero">
        <h1>Explosion of Flavors</h1>
        <p>Explore our wood-fired specialties, artisanal pizzas, and fresh catches.</p>
    </section>

    <!-- Category Filter Buttons -->
    <section class="menu-container">
        <div class="filter-buttons btn-container">
            <button class="filter-btn active" data-category="all">All Dishes</button>
            <button class="filter-btn" data-category="chicken">🍗 Chicken</button>
            <button class="filter-btn" data-category="burgers">🍔 Burgers</button>
            <button class="filter-btn" data-category="pizza">🍕 Pizza</button>
            <button class="filter-btn" data-category="seafood">🦞 Seafood</button>
            <button class="filter-btn" data-category="desserts">🍰 Desserts</button>
            <button class="filter-btn" data-category="drinks">🍹 Drinks</button>
        </div>

        <!-- Dynamic Menu Grid (Populated by JS) -->
        <div class="menu-grid section-center" id="menu-grid">
            <!-- JavaScript will inject cards here -->
        </div>
    </section>

    <!-- Master Footer -->
    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 World Best Kitchen. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./script.js"></script>
    <script src="./menu.js"></script>
</body>

</html>
